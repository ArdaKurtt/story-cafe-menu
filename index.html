<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39251e"><meta name="description" content="Story Cafe Lefke yemek, kahve ve tatlı menüsü."><title>Story Cafe · Menü</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2339251e'/%3E%3Ctext x='16' y='24' text-anchor='middle' fill='%23fff' font-size='25' font-family='Georgia'%3ES%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f1ed;color:#39251e;font-family:Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{background:#39251e;color:white;padding:24px 24px 22px;border-bottom:4px solid #b99763}.masthead{max-width:1120px;margin:auto;display:flex;align-items:center;gap:18px}.brand{font-family:Georgia,serif;font-size:38px;letter-spacing:2px;margin:0;line-height:1}.brand small{display:block;font-family:Arial;font-size:12px;letter-spacing:5px;margin-top:9px;font-weight:400}.mark{width:76px;height:76px;border-radius:50%;object-fit:cover;background:white}.right{margin-left:auto;text-align:right;font-size:14px;letter-spacing:2px;line-height:1.8}.right span{color:#dcc6a5;font-size:12px}nav{position:sticky;top:0;z-index:5;background:#f4f1edf5;backdrop-filter:blur(12px);border-bottom:1px solid #d8cdc1}.categories{max-width:1120px;margin:auto;display:flex;gap:8px;padding:15px 20px;overflow-x:auto;scrollbar-width:thin}.categories button{white-space:nowrap;border:1px solid #d9cbbb;border-radius:30px;padding:11px 17px;background:transparent;color:#574032;font-size:14px;min-height:44px}.categories button[aria-pressed=true]{background:#39251e;border-color:#39251e;color:white}main{max-width:1120px;margin:auto;padding:30px 24px 50px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#856843;margin:0 0 8px}h1{font-family:Georgia,serif;font-size:32px;font-weight:400;margin:0}.page-count{font-size:14px;color:#806b58}.menu-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:680px;margin:auto}.menu-grid.double{grid-template-columns:repeat(2,minmax(0,1fr));max-width:100%}.menu-page{border:1px solid #ddd2c6;padding:0;background:white;box-shadow:0 10px 35px #39251e0c;display:block;width:100%;border-radius:4px;overflow:hidden}.menu-page img{display:block;width:100%;height:auto}.caption{font-size:14px;text-align:center;color:#806b58;margin:18px 0 0}footer{border-top:1px solid #d8cdc1;max-width:1120px;margin:auto;padding:25px;text-align:center;font-family:Georgia,serif;font-size:16px;color:#806b58}dialog{border:0;padding:0;background:#f4f1ed;max-width:96vw;max-height:96dvh;width:950px;overflow:auto;border-radius:8px}dialog::backdrop{background:#130d0cdd}.dialog-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#39251e;color:white;z-index:1}.close{border:1px solid #8e7466;border-radius:25px;background:transparent;color:white;padding:10px 18px;min-height:44px}.large-image{display:block;width:100%;height:auto}button:focus-visible{outline:3px solid #bb8f41;outline-offset:3px}@media(min-width:900px){header{padding-top:30px;padding-bottom:30px}main{padding-top:38px}}@media(max-width:600px){header{padding:20px 18px}.brand{font-size:29px}.mark{width:60px;height:60px}.brand small{font-size:10px}.right{font-size:12px;letter-spacing:1px}.right span{font-size:10px}main{padding:24px 12px 35px}h1{font-size:27px}.heading{padding:0 6px}.menu-grid.double{grid-template-columns:1fr}.categories{padding:12px}.page-count{white-space:nowrap;font-size:12px}.caption{font-size:13px}}
</style></head><body><header><div class="masthead"><img class="mark" src="logo.webp" alt="Story Cafe logosu"><p class="brand">STORY<small>CAFE · LEFKE</small></p><div class="right">MENÜ<br><span>YEMEK · KAHVE · TATLI</span></div></div></header><nav aria-label="Menü kategorileri"><div class="categories" id="categories"></div></nav><main><div class="heading"><div><p class="eyebrow">Story Cafe</p><h1 id="title">Atıştırmalıklar</h1></div><span class="page-count" id="count"></span></div><div class="menu-grid" id="pages"></div><p class="caption">Büyütmek için menüye dokunun.</p></main><footer>Story Cafe · Lefke</footer><dialog id="zoom"><div class="dialog-bar"><span id="zoom-title">Menü</span><button class="close" id="close" aria-label="Büyütülmüş menüyü kapat">Kapat ✕</button></div><img class="large-image" id="large" alt=""></dialog><script>
const menu=[['Atıştırmalıklar',[1]],['Kahvaltı',[2]],['Sandviçler',[3]],['Yemekler',[4]],['Hamburgerler',[5]],['Salata · Pizza · Makarna',[6]],['Çıtır Kovalar',[7]],['Sıcak Kahveler',[8]],['Soğuk İçecekler',[9]],['Alkollü İçecekler',[10,11]],['Tatlılar',[12]]];
const nav=document.getElementById('categories'),pages=document.getElementById('pages'),dialog=document.getElementById('zoom');let selected=0;
menu.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{render(i);b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});window.scrollTo({top:0,behavior:'smooth'})};nav.append(b)});
function render(i){selected=i;const [name,nums]=menu[i];document.getElementById('title').textContent=name;document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+menu.length;[...nav.children].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));pages.replaceChildren();pages.classList.toggle('double',nums.length>1);nums.forEach((num,j)=>{const button=document.createElement('button');button.className='menu-page';button.setAttribute('aria-label',name+' menüsünü büyüt'+(nums.length>1?' — sayfa '+(j+1):''));const img=document.createElement('img');img.src='page-'+String(num).padStart(2,'0')+'.webp';img.alt='Story Cafe '+name+' ürünleri ve fiyatları'+(nums.length>1?' — sayfa '+(j+1):'');img.width=734;img.height=1100;button.append(img);button.onclick=()=>{document.getElementById('large').src=img.src;document.getElementById('large').alt=img.alt;document.getElementById('zoom-title').textContent=name;dialog.showModal()};pages.append(button)})}document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render(0);
</script></body></html>
